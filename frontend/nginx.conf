server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular HTML5-Routing: alle Routen auf index.html umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Anfragen an das Backend weiterleiten. Der Hostname muss dem
    # Service-Namen aus docker-compose.yml entsprechen (nicht dem
    # Container-Namen) - innerhalb des Docker-Netzwerks lösen Container
    # sich gegenseitig über den Service-Namen auf.
    location /api/ {
        proxy_pass http://flugbuch-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statische Assets effizient ausliefern
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
