<button type="button" class="pw-toggle" (click)="toggle()" tabindex="-1"
    [attr.aria-label]="(visible() ? 'COMMON.HIDE_PASSWORD' : 'COMMON.SHOW_PASSWORD') | translate"
    [title]="(visible() ? 'COMMON.HIDE_PASSWORD' : 'COMMON.SHOW_PASSWORD') | translate">
    @if (visible()) {
    <!-- eye-off -->
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M2.5 10s2.9-6 7.5-6c1.42 0 2.68.33 3.76.85M17.5 10s-1.02 2.1-3.03 3.7" />
        <path d="M8.2 8.35a2.25 2.25 0 003.45 2.87" />
        <path d="M5.2 5.2C3.4 6.35 2.5 10 2.5 10s2.9 6 7.5 6c1.35 0 2.55-.3 3.6-.78" />
        <path d="M3 3l14 14" />
    </svg>
    } @else {
    <!-- eye -->
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M2.5 10s2.9-6 7.5-6 7.5 6 7.5 6-2.9 6-7.5 6-7.5-6-7.5-6z" />
        <circle cx="10" cy="10" r="2.25" />
    </svg>
    }
</button>
