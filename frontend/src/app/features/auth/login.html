<div class="auth-shell">
    <div class="auth-lang-switch">
        <app-language-switcher />
    </div>
    <div class="auth-bg">
        <div class="auth-glow auth-glow-1"></div>
        <div class="auth-glow auth-glow-2"></div>
        <div class="auth-glow auth-glow-3"></div>
    </div>

    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L3 7l9 5 9-5-9-5z" opacity="0.9" />
                    <path d="M3 12l9 5 9-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6" />
                </svg>
            </div>
            <div>
                <div class="auth-logo-top">AERO</div>
                <div class="auth-logo-bottom">LOGBOOK</div>
            </div>
        </div>

        <h2 class="auth-title">{{ 'LOGIN.TITLE' | translate }}</h2>
        <p class="auth-sub">{{ 'LOGIN.SUBTITLE' | translate }}</p>

        @if (hasError()) {
        <div class="auth-error">
            <span>⚠</span> {{ errorMsg | translate }}
        </div>
        }

        <div class="auth-form">
            <div class="auth-field">
                <label class="auth-label">{{ 'COMMON.EMAIL' | translate }}</label>
                <input type="email" class="auth-input" placeholder="pilot@example.com" [(ngModel)]="email"
                    name="email" />
            </div>
            <div class="auth-field">
                <label class="auth-label">{{ 'COMMON.PASSWORD' | translate }}</label>
                <div class="pw-wrap">
                    <input [type]="passwordVisible() ? 'text' : 'password'" class="auth-input" placeholder="••••••••"
                        [(ngModel)]="password" name="password" />
                    <app-password-toggle [(visible)]="passwordVisible" />
                </div>
                <a class="auth-forgot" routerLink="/forgot-password">{{ 'LOGIN.FORGOT_PASSWORD' | translate }}</a>
            </div>

            <button class="auth-btn" (click)="login()" [disabled]="isLoading()">
                @if (isLoading()) {
                <span class="auth-spinner"></span> {{ 'COMMON.LOGGING_IN' | translate }}
                } @else {
                {{ 'COMMON.LOGIN' | translate }}
                }
            </button>
        </div>

        <p class="auth-footer">
            {{ 'LOGIN.NO_ACCOUNT' | translate }}
            <a routerLink="/register">{{ 'COMMON.REGISTER' | translate }}</a>
        </p>
        <p class="auth-footer">
            <a routerLink="/helpers">{{ 'HELPERS.VIEW_LIST_LINK' | translate }}</a>
        </p>
    </div>
</div>
