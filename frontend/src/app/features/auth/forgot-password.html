<div class="auth-shell">
    <div class="auth-bg">
        <div class="auth-glow auth-glow-1"></div>
        <div class="auth-glow auth-glow-2"></div>
        <div class="auth-glow auth-glow-3"></div>
    </div>

    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L3 7l9 5 9-5-9-5z" opacity="0.9" />
                    <path d="M3 12l9 5 9-5" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6" />
                </svg>
            </div>
            <div>
                <div class="auth-logo-top">AERO</div>
                <div class="auth-logo-bottom">LOGBOOK</div>
            </div>
        </div>

        <h2 class="auth-title">{{ 'FORGOT_PASSWORD.TITLE' | translate }}</h2>
        <p class="auth-sub">{{ 'FORGOT_PASSWORD.SUBTITLE' | translate }}</p>

        @if (isSubmitted()) {
        <div class="auth-success">{{ 'FORGOT_PASSWORD.SUCCESS' | translate }}</div>
        } @else {
        @if (hasError()) {
        <div class="auth-error">
            <span>⚠</span> {{ errorMsg | translate }}
        </div>
        }

        <div class="auth-form">
            <div class="auth-field">
                <label class="auth-label">{{ 'COMMON.EMAIL' | translate }}</label>
                <input type="email" class="auth-input" placeholder="pilot@example.com" [(ngModel)]="email"
                    name="email" />
            </div>

            <button class="auth-btn" (click)="submit()" [disabled]="isLoading()">
                @if (isLoading()) {
                <span class="auth-spinner"></span> {{ 'FORGOT_PASSWORD.SENDING' | translate }}
                } @else {
                {{ 'FORGOT_PASSWORD.SUBMIT' | translate }}
                }
            </button>
        </div>
        }

        <p class="auth-footer">
            <a routerLink="/login">{{ 'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
        </p>
    </div>
</div>
