spring:
    application:
        name: flugbuch

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:flugbuchdb}
        username: ${SPRING_DATASOURCE_USERNAME:sa}
        password: ${SPRING_DATASOURCE_PASSWORD:password}
        driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                # JDBC-Batching fuer Massen-saveAll (Import). Greift voll erst,
                # wenn die Id-Strategie nicht IDENTITY ist; schadet aber nie.
                jdbc:
                    batch_size: 500
                order_inserts: true
                order_updates: true

# FTP access for the daily flight log CSV import (ticket #29).
# The real values come from environment variables (see docker-compose.yml);
# without those variables these stay empty placeholders, which is fine for
# local development/tests since the scheduler never runs there.
ftp:
    host: ${FTP_HOST:}
    port: ${FTP_PORT:21}
    username: ${FTP_USERNAME:}
    password: ${FTP_PASSWORD:}
    remote-file-path: ${FTP_REMOTE_FILE_PATH:/flugbuch.csv}
    local-directory: ${FTP_LOCAL_DIRECTORY:/app/import}
