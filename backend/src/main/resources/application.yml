spring:
    application:
        name: flugbuch

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:flugbuchdb}
        username: ${SPRING_DATASOURCE_USERNAME:sa}
        password: ${SPRING_DATASOURCE_PASSWORD:password}
        driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                # JDBC-Batching fuer Massen-saveAll (Import). Greift voll erst,
                # wenn die Id-Strategie nicht IDENTITY ist; schadet aber nie.
                jdbc:
                    batch_size: 500
                order_inserts: true
                order_updates: true

# FTP access for the daily flight log CSV import (ticket #29).
# The real values come from environment variables (see docker-compose.yml);
# without those variables these stay empty placeholders, which is fine for
# local development/tests since the scheduler never runs there.
ftp:
    host: ${FTP_HOST:}
    port: ${FTP_PORT:21}
    username: ${FTP_USERNAME:}
    password: ${FTP_PASSWORD:}
    remote-file-path: ${FTP_REMOTE_FILE_PATH:/flugbuch.csv}
    local-directory: ${FTP_LOCAL_DIRECTORY:/app/import}

# Where the daily flight log PDF printout is written (see
# DailyFlightLogPrintScheduler, runs at 23:00). The default matches the
# local-development volume; production overrides it via PRINT_OUTPUT_DIRECTORY
# (see docker-compose.yml).
print:
    output-directory: ${PRINT_OUTPUT_DIRECTORY:/app/print}

# JWT signing secret for pilot login. The default below is fine for local
# development/tests only; production must override it via the JWT_SECRET
# environment variable with its own strong, random value (see docker-compose.yml).
jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-do-not-use-in-production-9f3a7c1e}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

# The frontend origin allowed to call this API (CORS). Defaults to the
# Angular dev server; override via CORS_ALLOWED_ORIGIN once the frontend
# has a real production URL (see docker-compose.yml).
cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Always-present ADMIN account, created on startup if it doesn't exist yet
# (see DefaultAdminSeeder). The password below is a local development/tests
# default only; production must override it via ADMIN_PASSWORD with a real,
# strong password (see docker-compose.yml).
admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin-local-dev-only-change-in-production}
