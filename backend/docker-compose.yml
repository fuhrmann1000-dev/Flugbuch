services:
  flugbuch-db:
    image: mysql:8.0
    container_name: flugbuch_db
    environment:
      MYSQL_DATABASE: flugbuch
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: flugbuch_user
      MYSQL_PASSWORD: flugbuch_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflugbuch_user", "-pflugbuch_password"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # SMTP-Catcher fuer "Passwort vergessen"-Mails im Dev-Betrieb - faengt jede
  # gesendete Mail ab, ohne sie zuzustellen. Weboberflaeche: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: flugbuch_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  flugbuch-app:
    build: .
    container_name: flugbuch_backend
    ports:
      - "8080:8080"
    depends_on:
      flugbuch-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://flugbuch-db:3306/flugbuch?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=flugbuch_user
      - SPRING_DATASOURCE_PASSWORD=flugbuch_password
      - SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # TODO: replace with the real FTP server details (ticket #29)
      - FTP_HOST=ftp.example.org
      - FTP_PORT=21
      - FTP_USERNAME=changeme
      - FTP_PASSWORD=changeme
      - FTP_REMOTE_FILE_PATH=/flugbuch.csv
      - FTP_LOCAL_DIRECTORY=/app/import
      - PRINT_OUTPUT_DIRECTORY=/app/print
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      # TODO: replace with a real SMTP provider (and set SMTP_AUTH/SMTP_STARTTLS
      # to true, plus SMTP_USERNAME/SMTP_PASSWORD) before going to production -
      # Mailpit never actually delivers anything.
      - PASSWORD_RESET_FRONTEND_URL=http://localhost:4200/reset-password
      # TODO: generate a strong random secret for production and put it here (or better, in a secrets manager)
      - JWT_SECRET=changeme-generate-a-strong-random-production-secret
      - JWT_EXPIRATION_MINUTES=60
      # TODO: point this at the real frontend URL once it's deployed
      - CORS_ALLOWED_ORIGIN=http://localhost:4200
      # TODO: set a real, strong password before deploying (this is a placeholder)
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme-set-a-strong-production-password
    volumes:
      - ./import-daten:/app/import
      - ./print-daten:/app/print

volumes:
  db_data:
