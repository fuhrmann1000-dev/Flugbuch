name: Deploy to VPS

# Fires on every push to main - in practice that means every merged pull
# request, since main is only ever updated that way. A dedicated
# `pull_request: types: [closed]` trigger would need an extra check for
# `github.event.pull_request.merged == true` (a closed-without-merge PR
# also fires `closed`) for no real benefit here, so push-to-main is the
# simpler, equivalent choice.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode herunterladen
        uses: actions/checkout@v4

      - name: SSH-Schlüssel einrichten
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Bekannte Hosts akzeptieren
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # TODO: /opt/flugbuch is a placeholder - replace with the real
      # deployment path on the target server once it's known.
      # --exclude=.git: checkout includes the full git history, which the
      # server has no use for and would only slow down every sync.
      - name: Dateien auf den vServer übertragen
        run: rsync -avz --delete --exclude=.git ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/flugbuch

      # Without this step the files land on the server but nothing ever
      # picks them up - the old containers just keep running the old code.
      # `--build` picks up any changed Dockerfile/dependencies, not just
      # source code; `-d` keeps it detached so the Action doesn't hang
      # waiting on container logs. `--profile frontend` is required: that
      # service is behind a profile in docker-compose.yml (so local devs
      # running the stack for backend work alone don't also need to build
      # the Angular image), but a real deployment needs it running too.
      - name: Container neu bauen und starten
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /opt/flugbuch && docker compose --profile frontend up -d --build'
