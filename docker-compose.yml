services:
  # ────────────────────────────────────────────
  #  Datenbank
  # ─────────────────────────────────────────────
  flugbuch-db:
    image: mysql:8.0
    container_name: flugbuch_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flugbuch
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: flugbuch_user
      MYSQL_PASSWORD: flugbuch_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uflugbuch_user",
          "-pflugbuch_password",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ─────────────────────────────────────────────
  #  phpMyAdmin
  # ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5
    container_name: flugbuch_phpmyadmin
    restart: unless-stopped
    depends_on:
      flugbuch-db:
        condition: service_healthy
    environment:
      PMA_HOST: flugbuch-db
      PMA_PORT: 3306
      PMA_USER: flugbuch_user
      PMA_PASSWORD: flugbuch_password
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - backend

  # ─────────────────────────────────────────────
  #  Mailpit – SMTP-Catcher fuer "Passwort vergessen"-Mails im Dev-Betrieb.
  #  Faengt jede gesendete Mail ab, ohne sie wirklich zuzustellen. Weboberflaeche: http://localhost:8025
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: flugbuch_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - backend

  # ─────────────────────────────────────────────
  #  Backend (Spring Boot)
  # ────────────────────────────────────────────
  flugbuch-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flugbuch_backend
    restart: unless-stopped
    depends_on:
      flugbuch-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://flugbuch-db:3306/flugbuch?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: flugbuch_user
      SPRING_DATASOURCE_PASSWORD: flugbuch_password
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # TODO: replace with a real SMTP provider (and set SMTP_AUTH/SMTP_STARTTLS
      # to true, plus SMTP_USERNAME/SMTP_PASSWORD) before going to production -
      # Mailpit never actually delivers anything.
      PASSWORD_RESET_FRONTEND_URL: http://localhost:4200/reset-password
    volumes:
      - ./backend/import-daten:/app/import
      - ./backend/print-daten:/app/print
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend

  # ─────────────────────────────────────────────
  #  Frontend (Angular) – erst aktiv mit Profil
  # ─────────────────────────────────────────────
  flugbuch-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flugbuch_frontend
    restart: unless-stopped
    depends_on:
      - flugbuch-backend
    ports:
      - "4200:80"
    networks:
      - frontend
    profiles:
      - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  db_data:
    driver: local
